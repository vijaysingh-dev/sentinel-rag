[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-rag"
version = "2.0.0"
description = "Multi-cloud RAG pipeline and multi-agent RCA system for an index calculation platform"
requires-python = "==3.12.*"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "langchain-core>=0.3.15",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlglot>=25.24",
]

[project.optional-dependencies]
# Local pipeline: parse, embed, store, rerank and generate with no cloud account at all.
local = [
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.2",
    "psycopg[binary,pool]>=3.2",
    "langchain-openai>=0.2.5",
    "redis>=5.2",
]

azure = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-search-documents>=11.6.0b4",
    "azure-identity>=1.19",
    "openai>=1.54",
    "langchain-openai>=0.2.5",
]

aws = [
    "boto3>=1.35",
    "opensearch-py>=2.7",
    "requests-aws4auth>=1.3",
    "langchain-aws>=0.2.6",
]

observability = [
    "prometheus-client>=0.21",
    "langfuse>=2.53",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

all = ["sentinel-rag[local,azure,aws,observability,dev]"]

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["sentinel"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
