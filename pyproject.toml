[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-rag"
version = "2.0.0"
description = "RAG pipeline (multi-cloud parsing, local-first embed/store/rerank) and multi-agent RCA system"
requires-python = "==3.12.*"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "langchain-core>=0.3.15",
    "langgraph>=0.2.45",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlglot>=25.24",
]

[project.optional-dependencies]
# Local pipeline: parse, embed, store and rerank with no cloud account at all. Also carries
# langchain-openai, since that SDK is shared by local-vs-OpenAI-embedding code paths and by the
# `inference` extra below — installing `local` alone does not select OpenAI anywhere, config does.
local = [
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=5.0",
    "psycopg[binary,pool]>=3.2",
    "langchain-openai>=0.2.5",
    "redis>=5.2",
]

# Parsing only (ADR-029): Azure Document Intelligence. Azure OpenAI, Azure AI Search and their
# SDKs are gone from this repo — see .archive/providers/.
azure = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-identity>=1.19",
]

# Parsing only (ADR-029): AWS Textract. Bedrock and OpenSearch are gone from this repo — see
# .archive/providers/.
aws = [
    "boto3>=1.35",
]

# The three inference vendors embed_provider/rerank_provider/llm_provider can select, plus local's
# langchain-openai. One extra because picking any one of them for evaluation or a bake-off usually
# means wanting to compare against the others.
inference = [
    "openai>=1.54",
    "langchain-openai>=0.2.5",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "cohere>=5.13",
]

observability = [
    "prometheus-client>=0.21",
    "langfuse>=2.53",
]

dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

# The LangGraph dev server, for driving the graph from the web/ chat UI (`make chat-server`).
# Separate extra because it pulls a FastAPI/uvicorn dev stack that nothing else needs.
chat = [
    "langgraph-cli[inmem]>=0.1.55",
]

# Corpus generation: writes the knowledge corpus (PDF/DOCX/PPTX/XLSX/MD) from the otel-demo's
# own compose.yaml, dependency graph and flagd fault list. Tooling only — nothing in `sentinel/`
# imports it. Kept out of `local` so the pipeline's install stays about *reading* documents.
corpus = [
    "reportlab>=4.2",
    "pillow>=10.4",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

all = ["sentinel-rag[local,azure,aws,inference,observability,dev,corpus,chat]"]

[tool.hatch.build.targets.wheel]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["sentinel"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
