# Extras layer: override this file in your fork to add or modify services
# for your own observability backend or additional components.
#
# This file is intentionally empty. It is always loaded last, giving forks
# a stable, well-defined seam to customize without touching upstream files.
#
# Usage:
#   docker compose -f compose.yaml -f compose.full.yaml -f compose.observability.yaml -f compose.extras.yaml up
#
# Example: add a service and patch the otel-collector to export to it:
#
# services:
#   my-backend:
#     image: myvendor/backend:latest
#     ports:
#       - "4317"
#
#   otel-collector:
#     depends_on:
#       my-backend:
#         condition: service_started
#
# Then add your exporter config to src/otel-collector/otelcol-config-extras.yml.

# --- sentinel-rag additions below: see /projects/sentinel-rag/app/{system-monitor,incident-generator} ---
#
# Why flagd/flagd-ui/astronomy-db get their volumes overridden here rather than left as
# upstream's `./src/...` bind mounts: this repo's checkout lives on a filesystem where chmod
# is a no-op (fuseblk/drvfs-style mount — verify with `stat` before assuming otherwise), so any
# container whose entrypoint drops to a non-root user to read a bind-mounted file gets
# "permission denied" (postgres and flagd both do this). The fix isn't to chmod the git-tracked
# copy — it stays git-friendly, portable, and untouched — it's to keep a separate *runtime*
# staging copy on a real filesystem ($HOME, ext4) that containers actually mount. This also
# happens to be the right separation on its own merits: incident-generator rewrites
# demo.flagd.json continuously as flags flip on and off, and that churn has no business showing
# up as uncommitted changes against the tracked baseline every time `git status` runs.
#
# One-time seed, or to reset the running demo back to its shipped defaults:
#   cp app/otel-demo/src/postgresql/init.sql   ~/.local/share/sentinel-rag/runtime/postgresql/
#   cp app/otel-demo/src/flagd/demo.flagd.json ~/.local/share/sentinel-rag/runtime/flagd/
#   cp app/otel-demo/src/jaeger/config.yml            ~/.local/share/sentinel-rag/runtime/jaeger/
#   cp app/otel-demo/src/jaeger/ui-config.json        ~/.local/share/sentinel-rag/runtime/jaeger/
#   cp app/otel-demo/src/grafana/grafana.ini          ~/.local/share/sentinel-rag/runtime/grafana/
#   cp -r app/otel-demo/src/grafana/provisioning      ~/.local/share/sentinel-rag/runtime/grafana/
#   cp app/otel-demo/src/prometheus/prometheus-config.yaml ~/.local/share/sentinel-rag/runtime/prometheus/
#   cp app/otel-demo/otel-config.yml ~/.local/share/sentinel-rag/runtime/product-catalog/
#
# jaeger/grafana/prometheus (compose.observability.yaml) hit the exact same fuseblk bind-mount
# problem the moment this stack is started with that file layered in — discovered when
# `make otel-demo-up` first actually ran the observability layer from this checkout; nobody had
# exercised that combination from here before. Same fix, same reasoning as above.
#
# product-catalog's own ./otel-config.yml bind (compose.yaml) is the same problem again, found
# only once product-catalog itself finally ran here (it always talked to astronomy-db before, so
# reaching Sentinel's postgres was never the blocker — reading this file was): the OTel Go SDK's
# `otelconf.NewSDK()` call fails to read a 0700 file it doesn't own and calls `os.Exit(1)` via its
# own structured logger, which ships to the OTLP log pipeline rather than stdout/stderr — hence a
# crash loop with zero `docker logs` output, confirmed by reproducing it with `compose run`.
#
# --- resource sharing with the global postgres/redis (see /projects/sentinel-rag/docker-compose.yml) ---
#
# astronomy-db (80M memory limit) and valkey-cart (20M) are both well under a size where running
# a second Postgres and a second Redis is worth it. Both are always-on, standalone containers
# (plain `docker run`, not compose — see CLAUDE.md/README for the exact commands), started once
# on the `infra` Docker network and shared by this app, Sentinel, and anything else that needs a
# Postgres or a Redis, the same way Portainer is one always-on container nothing "belongs" to.
# So both containers are removed here (`docker compose ... up` on this file set no longer starts
# them) and the three services that actually talked to them — product-catalog, cart,
# otel-collector's pg_stat_statements scrape — join that `infra` network instead.
#
# `astronomy_db`/`astronomy_user` (init.sql, applied by hand once against the global Postgres
# server — see `make otel-demo-up`) is its own database inside that Postgres instance, not a
# shared schema: nothing here touches Sentinel's `sentinel` database or its ops_knowledge/langfuse
# tables. Valkey is namespaced onto Redis logical DB 1 (Sentinel's own cache uses DB 0, see
# sentinel/core/cache.py) via VALKEY_ADDR's `defaultDatabase=1` — set in .env.override — so cart's
# keys can never collide with Sentinel's.
#
# Prerequisite: postgres and redis must already be running on the `infra` network (they're
# always-on, so normally they just are) — product-catalog and cart depend on reaching them by
# name, and compose does not start another project's or another mechanism's containers for you.
networks:
  infra:
    name: infra
    external: true

services:
  # Compose has no "delete a service defined in an earlier -f file" directive, so both are gated
  # behind a profile ("disabled-by-sentinel-rag") that nothing ever activates — Compose excludes
  # any service with a `profiles:` list unless one of its profiles is requested, which is exactly
  # "don't start this" applied from an override layer.
  astronomy-db:
    profiles: ["disabled-by-sentinel-rag"]

  valkey-cart:
    profiles: ["disabled-by-sentinel-rag"]

  product-catalog:
    networks:
      - default
      - infra
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    volumes:
      - /home/vijay/.local/share/sentinel-rag/runtime/product-catalog/otel-config.yml:/otel-config.yml
    # `depends_on: {condition: service_healthy}` can only reference a service in this same
    # compose project — postgres isn't part of any compose project any more, it's a standalone
    # always-on container on the `infra` network — so the healthcheck gate upstream had on
    # astronomy-db is dropped outright rather than replaced: postgres/redis are expected to
    # simply already be running (that's the point of "always-on"), so there is nothing to wait on.
    depends_on:
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started
      astronomy-db: !reset null

  cart:
    networks:
      - default
      - infra
    # Same reasoning as product-catalog above: redis is a standalone always-on container, not
    # part of this or any compose project, so there's no service to express a health-gated
    # depends_on against — it's simply expected to already be running.
    depends_on:
      valkey-cart: !reset null
      otel-collector:
        condition: service_started
      flagd:
        condition: service_started

  otel-collector:
    networks:
      - default
      - infra
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432

  # accounting (compose.full.yaml) writes orders into astronomy_db, so it needs the same `infra`
  # route to the shared postgres that product-catalog has; POSTGRES_HOST=postgres comes from
  # .env.override and feeds its DB_CONNECTION_STRING.
  accounting:
    networks:
      - default
      - infra

  flagd:
    volumes:
      - /home/vijay/.local/share/sentinel-rag/runtime/flagd:/etc/flagd

  flagd-ui:
    volumes:
      - /home/vijay/.local/share/sentinel-rag/runtime/flagd:/app/data

  jaeger:
    # Upstream publishes the query port to a random host port, which leaves Sentinel's trace tools
    # (settings.jaeger_url) with nothing stable to point at. Going through frontend-proxy's
    # /jaeger/ route would work too, but then every query Sentinel makes becomes an Envoy span in
    # the very traces it is investigating. Compose appends this to upstream's ports list.
    # Jaeger's base_path (/jaeger/ui) still applies: the API is at :16686/jaeger/ui/api/.
    ports:
      - "16686:16686"
    volumes:
      - /home/vijay/.local/share/sentinel-rag/runtime/jaeger/config.yml:/etc/jaeger/config.yml
      - /home/vijay/.local/share/sentinel-rag/runtime/jaeger/ui-config.json:/etc/jaeger/ui-config.json

  grafana:
    volumes:
      - /home/vijay/.local/share/sentinel-rag/runtime/grafana/grafana.ini:/etc/grafana/grafana.ini
      - /home/vijay/.local/share/sentinel-rag/runtime/grafana/provisioning/:/etc/grafana/provisioning/

  prometheus:
    volumes:
      - /home/vijay/.local/share/sentinel-rag/runtime/prometheus/prometheus-config.yaml:/etc/prometheus/prometheus-config.yaml

  system-monitor:
    build:
      context: /projects/sentinel-rag/app/system-monitor
    container_name: system-monitor
    networks:
      - default
      - infra
    ports:
      - "8091:8000"
    volumes:
      # Read-only access to the Docker API is how this service reads every other container's
      # own healthcheck state instead of reimplementing gRPC/HTTP/TCP probes per service.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # `infra` network membership (above) is what makes these container-name hostnames
      # resolvable — same network product-catalog and cart themselves reach postgres/redis over.
      - MONITOR_REDIS_URL=redis://redis:6379/1
      - MONITOR_POSTGRES_DSN=postgresql://astronomy_user:astronomy_password@postgres:5432/astronomy_db

  incident-generator:
    build:
      context: /projects/sentinel-rag/app/incident-generator
    container_name: incident-generator
    ports:
      - "8092:8000"
    volumes:
      # Same runtime copy flagd and flagd-ui mount above — editing it is how a fault gets
      # injected, with no flagd API involved.
      - /home/vijay/.local/share/sentinel-rag/runtime/flagd:/etc/flagd
      # incidents.jsonl ground truth, kept outside the container so it survives a rebuild.
      - /home/vijay/.local/share/sentinel-rag/app/incident-generator-data:/app/data
    depends_on:
      flagd:
        condition: service_started
